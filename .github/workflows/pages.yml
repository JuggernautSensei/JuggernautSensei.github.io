name: Verify and publish Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the reviewed public site'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || vars.NOTION_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:privacy
      - run: npm run test:sync
      - name: Sync approved public Notion content
        if: vars.NOTION_SYNC_ENABLED == 'true' && github.event_name != 'pull_request'
        run: npm run sync:notion
      - run: npm run check
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'schedule' && vars.NOTION_AUTO_DEPLOY_ENABLED == 'true')) && github.ref == 'refs/heads/main' && github.repository == 'JuggernautSensei/JuggernautSensei.github.io'
        with:
          path: _site

  deploy:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'schedule' && vars.NOTION_AUTO_DEPLOY_ENABLED == 'true')) && github.ref == 'refs/heads/main' && github.repository == 'JuggernautSensei/JuggernautSensei.github.io'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
